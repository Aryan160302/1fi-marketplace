  <circle cx="163" cy="88" r="17" fill="url(#lensS24)"/>
  <circle cx="158" cy="82" r="4.5" fill="#ffffff" opacity="0.5"/>

  <circle cx="163" cy="140" r="26" fill="url(#rimS24)"/>
  <circle cx="163" cy="140" r="20.5" fill="url(#lensS24)"/>
  <circle cx="157" cy="133" r="5" fill="#ffffff" opacity="0.5"/>

  <circle cx="163" cy="196" r="22" fill="url(#rimS24)"/>
  <circle cx="163" cy="196" r="17" fill="url(#lensS24)"/>
  <circle cx="158" cy="190" r="4.5" fill="#ffffff" opacity="0.5"/>

  <circle cx="163" cy="244" r="18" fill="url(#rimS24)"/>
  <circle cx="163" cy="244" r="13.5" fill="url(#lensS24)"/>
