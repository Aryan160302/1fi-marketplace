<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyS24" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b4b55"/>
      <stop offset="0.5" stop-color="#2c2c34"/>
      <stop offset="1" stop-color="#151519"/>
    </linearGradient>
    <linearGradient id="rimS24" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5a64"/>
      <stop offset="1" stop-color="#26262c"/>
    </linearGradient>
    <linearGradient id="lensS24" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7fb8"/>
