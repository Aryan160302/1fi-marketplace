<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lidMB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f2"/>
      <stop offset="1" stop-color="#cfcfd4"/>
    </linearGradient>
    <linearGradient id="baseMB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e2e6"/>
      <stop offset="1" stop-color="#c5c5cb"/>
    </linearGradient>
    <linearGradient id="screenMB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#1e0a4a"/>
    </linearGradient>
    <radialGradient id="glowMB" cx="0.3" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="300" rx="126" ry="13" fill="#000000" opacity="0.10"/>

  <!-- lid -->
  <rect x="98" y="70" width="204" height="144" rx="12" fill="url(#lidMB)"/>
  <rect x="106" y="78" width="188" height="128" rx="7" fill="url(#screenMB)"/>
  <rect x="106" y="78" width="188" height="128" rx="7" fill="url(#glowMB)"/>
  <rect x="169" y="78" width="18" height="6" rx="3" fill="#0e0e10" opacity="0.5"/>

  <!-- screen content: simple app-grid motif -->
  <g opacity="0.85">
    <rect x="124" y="96" width="22" height="22" rx="6" fill="#ffffff" opacity="0.22"/>
    <rect x="152" y="96" width="22" height="22" rx="6" fill="#ffffff" opacity="0.16"/>
    <rect x="180" y="96" width="22" height="22" rx="6" fill="#ffffff" opacity="0.16"/>
    <rect x="124" y="124" width="50" height="8" rx="4" fill="#ffffff" opacity="0.28"/>
    <rect x="124" y="138" width="80" height="6" rx="3" fill="#ffffff" opacity="0.16"/>
  </g>

  <!-- hinge -->
  <rect x="94" y="212" width="212" height="8" rx="4" fill="#b7b7bd"/>

  <!-- base / keyboard deck (trapezoid for a hint of perspective) -->
  <path d="M70 220 H330 L352 268 Q354 276 346 276 H54 Q46 276 48 268 Z" fill="url(#baseMB)"/>
  <path d="M70 220 H330 L352 268 Q354 276 346 276 H54 Q46 276 48 268 Z" fill="none" stroke="#b0b0b6" stroke-width="1"/>

  <!-- keyboard key rows -->
  <g fill="#a9a9b0">
    <rect x="92" y="232" width="216" height="7" rx="3.5" opacity="0.7"/>
    <rect x="88" y="244" width="224" height="7" rx="3.5" opacity="0.7"/>
    <rect x="84" y="256" width="232" height="7" rx="3.5" opacity="0.7"/>
  </g>

  <!-- trackpad -->
  <rect x="158" y="266" width="84" height="4" rx="2" fill="#9a9aa1" opacity="0.9"/>
</svg>
